<style>
  :root{
    --ink:#12203B; --ink-soft:#1C2E52; --parchment:#EFE3C7; --parchment-dim:#E3D5B2;
    --stamp:#B23A32; --brass:#C9A227; --teal:#2F6F68; --text-light:#F3ECDD; --text-dark:#1B2A44;
    --font-display:'Big Shoulders Display',sans-serif; --font-body:'Source Serif 4',serif; --font-mono:'Special Elite',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text-light); font-family:var(--font-body);}
  .wrap{max-width:1040px; margin:0 auto; padding:0 28px;}
  .eyebrow{font-family:var(--font-mono); letter-spacing:.15em; text-transform:uppercase; font-size:.72rem; color:var(--brass);}
  .stamp-ring{ filter:url(#inkTexture); }

  /* HERO */
  .hero{ text-align:center; padding:70px 24px 40px; }
  .hero h1{ font-family:var(--font-display); font-weight:900; font-size:clamp(2.4rem,8vw,4.2rem); margin:16px 0 6px; line-height:.95;}
  .hero h1 span{ color:var(--stamp); }
  .hero-title{ font-family:var(--font-display); font-weight:900; color:var(--text-light); margin:0; line-height:.92; font-size:clamp(2.8rem,10vw,5.2rem); letter-spacing:.01em; }
  .hero-handle{ font-family:var(--font-mono); font-size:.8rem; letter-spacing:.1em; color:var(--brass); margin-top:8px; }
  .hero p{ font-family:var(--font-body); font-style:italic; color:var(--parchment-dim); max-width:46ch; margin:0 auto; font-size:1.05rem;}
  .hero-quote{ font-family:var(--font-body); font-style:italic; font-weight:600; color:var(--parchment-dim); max-width:38ch; margin:26px auto 6px; font-size:clamp(1.1rem,2.8vw,1.35rem); line-height:1.35; }

  .badge-wrap{ width:190px; height:190px; margin:20px auto 0; }
  .badge-wrap svg{ width:100%; height:100%; }
  .badge-num{ font-family:var(--font-display); font-weight:900; font-size:2.6rem; fill:var(--text-light); }
  .badge-label{ font-family:var(--font-mono); font-size:.55rem; letter-spacing:.1em; fill:var(--brass); }

  /* TICKET */
  .ticket{
    position:relative; background:var(--parchment); color:var(--text-dark); border-radius:14px;
    display:flex; align-items:stretch; box-shadow:0 25px 60px -25px rgba(0,0,0,.5); margin:36px 0 50px;
  }
  .ticket-main{ flex:1; padding:28px 32px; }
  .ticket-stub{
    width:170px; border-left:2px dashed rgba(27,42,68,.35); padding:28px 20px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  }
  .ticket-row{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:rgba(27,42,68,.6); margin-bottom:6px;}
  .ticket-route{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin:4px 0 16px; }
  .route-col{ display:flex; flex-direction:column; gap:4px; }
  .route-col.right{ align-items:flex-end; text-align:right; }
  .route-label{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.05em; text-transform:uppercase; color:rgba(27,42,68,.6); }
  .route-num{ font-family:var(--font-display); font-weight:800; font-size:1.7rem; color:var(--text-dark); }
  .plane{ color:var(--stamp); font-size:1.1rem; }
  .track{ position:relative; height:7px; border-radius:6px; background:rgba(27,42,68,.15); }
  .track-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--teal), var(--stamp)); }
  .ticket-stub .big{ font-family:var(--font-display); font-weight:900; font-size:2.2rem; color:var(--stamp); line-height:1;}
  .ticket-stub .small{ font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; color:rgba(27,42,68,.65); margin-top:6px;}

  /* CTA */
  .cta-banner{ background:var(--ink-soft); border:1px solid rgba(201,162,39,.25); text-align:center; padding:22px 24px; margin:0 0 36px; border-radius:14px; }
  .cta-banner p{ margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:1.15rem; }
  .cta-banner span{ font-family:var(--font-mono); font-size:.72rem; color:var(--parchment-dim); }

  /* FILTERS */
  .controls{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding-bottom:30px; }
  .chip{
    font-family:var(--font-mono); font-size:.7rem; letter-spacing:.04em; text-transform:uppercase;
    background:var(--ink-soft); color:var(--parchment-dim); border:1px solid rgba(243,236,221,.15);
    padding:7px 14px; border-radius:20px; cursor:pointer; user-select:none;
  }
  .chip.active{ background:var(--brass); color:var(--ink); border-color:var(--brass); font-weight:700;}

  /* CARDS as stamps */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding-bottom:60px; align-items:start; }

  @media (max-width:980px){
    .grid{ grid-template-columns:1fr; }
    .card-meta{ grid-column:1; }
  }
  .card{
    background:var(--parchment); color:var(--text-dark); border-radius:8px; padding:20px 18px 18px;
    position:relative; box-shadow:0 16px 34px -18px rgba(0,0,0,.5);
  }
  .card .id{ font-family:var(--font-mono); font-size:.65rem; color:var(--stamp); letter-spacing:.05em;}
  .card h3{ font-family:var(--font-display); font-weight:800; font-size:1.15rem; margin:8px 0 6px; line-height:1.12; color:var(--text-dark);}
  .card .meta{ font-family:var(--font-mono); font-size:.66rem; color:rgba(27,42,68,.6); }
  .card .cat{ display:inline-block; margin-top:12px; font-size:.6rem; letter-spacing:.05em; text-transform:uppercase;
    border:1px solid rgba(27,42,68,.25); border-radius:20px; padding:3px 9px; color:rgba(27,42,68,.55);}

  .card-meta{ grid-column:span 2; }
  .meta-progress{ margin-top:14px; }
  .meta-progress .bar{ height:7px; border-radius:6px; background:rgba(27,42,68,.15); overflow:hidden; }
  .meta-progress .fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--teal), var(--stamp)); }
  .meta-progress .num{ font-family:var(--font-mono); font-size:.68rem; color:rgba(27,42,68,.65); margin-top:6px; }
  .flag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center; }
  .flag-row img{ width:22px; height:16px; border-radius:2px; object-fit:cover; box-shadow:0 0 0 1px rgba(27,42,68,.15); }
  .stampmark{
    position:absolute; top:14px; right:14px; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; transform:rotate(-12deg);
  }
  .stampmark.done{ border:1.6px solid var(--teal); }
  .stampmark span{ font-family:var(--font-mono); font-size:.48rem; text-align:center; line-height:1.05; }
  .stampmark.done span{ color:var(--teal); }

  .empty{ text-align:center; color:var(--parchment-dim); font-family:var(--font-mono); font-size:.8rem; padding:30px 0; grid-column:1/-1; }

  footer{ text-align:center; padding:50px 24px 70px; }
  footer p{ font-family:var(--font-body); font-style:italic; color:var(--parchment-dim); margin-bottom:16px;}
  footer .handle{ font-family:var(--font-mono); letter-spacing:.1em; color:var(--brass); font-size:.9rem;}
</style>
</head>

const COUNTRIES_TOTAL = 195;
const CONTINENTS_VISITED = 4;
const CONTINENTS_TOTAL = 5;

function metaExtra(d){
  if (d.id === 'H136'){
    const pct = Math.round(100 * VISITED_FLAGS.length / COUNTRIES_TOTAL);
    const flagsHtml = VISITED_FLAGS.map(function(f){
      return '<img src="data:image/svg+xml;base64,' + f.b64 + '" alt="' + f.name + '" title="' + f.name + '">';
    }).join('');
    return '<div class="meta-progress"><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="num">' + VISITED_FLAGS.length + ' / ' + COUNTRIES_TOTAL + ' países (' + pct + '%)</div></div>' +
      '<div class="flag-row">' + flagsHtml + '</div>';
  }
  if (d.id === 'H030'){
    const pct = Math.round(100 * CONTINENTS_VISITED / CONTINENTS_TOTAL);
    return '<div class="meta-progress"><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="num">' + CONTINENTS_VISITED + ' / ' + CONTINENTS_TOTAL + ' continentes</div></div>';
  }
  if (d.id === 'H137'){
    const doneCount = DATA.filter(function(x){ return x.estado === 'Completado'; }).length;
    const pct = Math.round(100 * doneCount / DATA.length);
    return '<div class="meta-progress"><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="num">' + doneCount + ' / ' + DATA.length + ' historias (' + pct + '%)</div></div>';
  }
  return '';
}

function render(){
  grid.innerHTML = '';
  const items = DATA.filter(function(d){
    const okState = stateFilter === 'Todas' || d.estado === stateFilter;
    const okCat = catFilter === 'Todas' || d.cat === catFilter;
    return okState && okCat;
  });
  if (items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada por aquí con estos filtros.';
    grid.appendChild(empty);
    return;
  }
  items.forEach(function(d){
    const el = document.createElement('div');
    const isMetaCard = (d.id === 'H136' || d.id === 'H030' || d.id === 'H137');
    el.className = 'card' + (isMetaCard ? ' card-meta' : '');
    const place = [d.ciudad, d.pais].filter(Boolean).join(' · ');
    const isDone = d.estado === 'Completado';
    el.innerHTML =
      (isDone ? '<div class="stampmark done"><span>HECHO</span></div>' : '') +
      '<div class="id">' + d.id + '</div>' +
      '<h3>' + d.nombre + '</h3>' +
      (place ? '<div class="meta">' + place + '</div>' : '') +
      '<div class="cat">' + d.cat + '</div>' +
      (isMetaCard ? metaExtra(d) : '');
    grid.appendChild(el);
  });
}

function buildChips(container, options, current, onSelect){
  container.innerHTML = '';
  options.forEach(function(opt){
    const chip = document.createElement('div');
    chip.className = 'chip' + (opt === current ? ' active' : '');
    chip.textContent = opt;
    chip.addEventListener('click', function(){
      onSelect(opt);
      refreshChips();
      render();
    });
    container.appendChild(chip);
  });
}

function refreshChips(){
  buildChips(stateControls, ['Todas','Pendiente','Completado'], stateFilter, function(v){ stateFilter = v; });
  buildChips(catControls, cats, catFilter, function(v){ catFilter = v; });
}

refreshChips();
render();
</script>
